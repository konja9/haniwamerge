<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#6b3d1f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>はにわマージ</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <header id="hud">
    <div class="hud-main">
      <div class="soil">
        <span class="soil-label">土</span>
        <span id="soil" class="soil-value">0</span>
      </div>
      <div class="sub">
        <span id="rate">+0/秒</span>
        <span class="sep">・</span>
        <span id="best">最高 Lv1</span>
      </div>
    </div>
    <div class="hud-buttons">
      <button id="btn-sound" type="button" aria-label="効果音">🔊</button>
      <button id="btn-reset" type="button" aria-label="最初から">↺</button>
    </div>
  </header>

  <div id="toast" aria-live="polite"></div>
  <div id="safe-probe" aria-hidden="true"></div>

  <!-- 読み込み順: 設定 → 描画 → 音 → 保存 → 演出 → 本体 -->
  <script src="js/config.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/effects.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
